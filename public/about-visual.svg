<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>
  <rect width="500" height="500" fill="url(#glow)"/>

  <!-- faint blueprint grid -->
  <g stroke="#27272a" stroke-width="1">
    <path d="M0 100H500 M0 200H500 M0 300H500 M0 400H500"/>
    <path d="M100 0V500 M200 0V500 M300 0V500 M400 0V500"/>
  </g>

  <!-- architectural corner brackets -->
  <g stroke="#34d399" stroke-width="2" fill="none" opacity="0.55">
    <path d="M60 90 V60 H90"/>
    <path d="M410 60 H440 V90"/>
    <path d="M440 410 V440 H410"/>
    <path d="M90 440 H60 V410"/>
  </g>

  <!-- connected node network: structure + deal-making -->
  <g stroke="#10b981" stroke-width="1.6" fill="none" opacity="0.9">
    <path d="M120 340 L200 260 L270 300 L360 175 L430 150"/>
  </g>
  <g fill="#10b981">
    <circle cx="120" cy="340" r="5"/>
    <circle cx="270" cy="300" r="5"/>
    <circle cx="430" cy="150" r="6"/>
  </g>
  <g fill="#A8763B">
    <circle cx="200" cy="260" r="6"/>
    <circle cx="360" cy="175" r="6"/>
  </g>

  <!-- secondary thin lattice -->
  <g stroke="#ECEAE2" stroke-width="1" opacity="0.14">
    <path d="M120 340 L60 400"/>
    <path d="M430 150 L470 110"/>
    <path d="M200 260 L200 200"/>
    <path d="M360 175 L360 120"/>
  </g>

  <!-- monogram, subtle -->
  <text x="250" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="150" fill="#ECEAE2" opacity="0.06">I</text>
</svg>
